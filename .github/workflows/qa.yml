name: QA & E2E Verification

on:
  push:
    branches: [ dev, staging, main ]
  pull_request:
    branches: [ dev, staging, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://fake.supabase.co' }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'fake-key-for-testing' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'admin123' }}
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'test-secret-key-123456789' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-jwt-secret-123456789' }}
      PYTHONPATH: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Run Backend Unit & Integration Tests
        run: |
          pytest tests/test_kiosk_and_attendance.py -v

      - name: Start Local Uvicorn Server & Run Playwright E2E
        run: |
          python -m uvicorn main:app --port 8000 &
          sleep 4
          pytest tests/test_e2e_playwright.py -v
