name: QA & E2E Verification

on:
  push:
    branches: [ dev, staging, main ]
  pull_request:
    branches: [ dev, staging, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://fake.supabase.co' }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'fake-key-for-testing' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'admin123' }}
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'test-secret-key-123456789' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-jwt-secret-123456789' }}
      PYTHONPATH: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Run Backend Unit & Integration Tests
        run: |
          # Seluruh direktori tests/, bukan satu file: sebelumnya
          # test_photobooth_api.py dan test_observability.py tidak pernah
          # dijalankan CI sehingga hijau di sini tidak berarti apa-apa.
          pytest tests/ --ignore=tests/test_e2e_playwright.py -v

      - name: Start Local Uvicorn Server & Run Playwright E2E
        run: |
          python -m uvicorn main:app --port 8000 &
          SERVER_PID=$!
          # Tunggu /health benar-benar hijau, bukan menebak dengan sleep.
          # Memuat model InsightFace bisa jauh lebih lama dari 4 detik di runner,
          # dan `sleep` membuat E2E gagal secara acak tanpa sebab yang jelas.
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "Server siap setelah ${i} detik:"
              curl -sS http://127.0.0.1:8000/health
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "::error::Server mati saat startup"; exit 1
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Server tidak pernah sehat dalam 60 detik"; exit 1
            fi
            sleep 1
          done
          pytest tests/test_e2e_playwright.py -v
