name: QA & E2E Verification

on:
  push:
    branches: [ dev, staging, main ]
  pull_request:
    branches: [ dev, staging, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest playwright pytest-playwright

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Run Backend Unit & Integration Tests
        run: |
          python -m pytest tests/test_kiosk_and_attendance.py -v
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

      - name: Start Local Uvicorn Server & Run Playwright E2E
        run: |
          python -m uvicorn main:app --port 8000 &
          sleep 3
          python -m pytest tests/test_e2e_playwright.py -v
