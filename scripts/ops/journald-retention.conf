# Retensi journald untuk VPS KP. Dipasang sebagai drop-in, bukan dengan
# menyunting /etc/systemd/journald.conf, supaya upgrade paket systemd tidak
# menimpanya dan supaya jelas mana pengaturan milik kita.
#
# Kenapa perlu: log aplikasi (faceid/uvicorn) hanya ada di journald. Saat
# forensik Gibbor, pertanyaan pertama adalah "apakah log 19 September masih
# ada?" — dan itu bergantung pada batas bawaan yang tidak pernah kita pilih.
# Grafana Cloud gratis hanya menyimpan log 14 hari; journald lokal adalah
# cadangan jangka panjangnya.
#
# Kenapa angkanya segini:
# - SystemMaxUse=1G: bawaan systemd adalah 10% ukuran disk (maks 4G). Di disk
#   VPS kecil itu bisa terlalu kecil atau terlalu rakus. 1 GB cukup longgar:
#   satu baris log JSON per request kira-kira 400 byte, Sabtu sibuk beberapa
#   ribu request, dan journald memampatkan isinya — 90 hari log aplikasi masih
#   jauh di bawah 1 GB.
# - SystemKeepFree=2G: kalau disk menipis, journald yang mengalah, bukan
#   aplikasi atau database. Disk penuh jauh lebih berbahaya daripada log hilang.
# - MaxRetentionSec=90day: cukup untuk menjangkau satu acara besar ke acara
#   berikutnya dan bahan retrospeksi per kuartal; lebih lama dari itu jarang
#   dibutuhkan dan hanya menambah data pribadi (IP, user_id) yang tersimpan.
# - MaxFileSec=1week: journald menghapus per berkas, bukan per baris. Dengan
#   bawaan satu bulan per berkas, "90 hari" bisa molor jadi hampir 120 hari.
# - Storage=persistent: tanpa ini, kalau /var/log/journal tidak ada, journal
#   hanya di RAM dan hilang setiap reboot.
#
# Pasang (di VPS, sebaiknya di luar Sabtu 15:00-19:00 WIB):
#
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp journald-retention.conf /etc/systemd/journald.conf.d/kp-retention.conf
#   sudo systemctl restart systemd-journald
#   journalctl --disk-usage
#   sudo systemd-analyze cat-config systemd/journald.conf | tail -n 20
#   sudo journalctl -u faceid -n 5 --no-pager     # log aplikasi masih mengalir
#
# Restart journald aman di systemd modern (stream stdout layanan disimpan
# di fd store, jadi faceid tidak kehilangan saluran log-nya), tapi tetap
# lakukan di jam sepi dan cek langkah terakhir di atas.
#
# Referensi: https://man7.org/linux/man-pages/man5/journald.conf.5.html

[Journal]
Storage=persistent
SystemMaxUse=1G
SystemKeepFree=2G
MaxRetentionSec=90day
MaxFileSec=1week
