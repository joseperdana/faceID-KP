# Format log akses nginx "kp_timed": format combined bawaan + empat kolom yang
# selama ini tidak kita punya. Tanpa kolom waktu, 504 dan 499 hanya bilang
# "ada yang lambat", tidak bilang berapa lama dan di sisi mana.
#
#   rt=  $request_time           total waktu request di nginx (detik, resolusi ms)
#   urt= $upstream_response_time waktu yang dihabiskan aplikasi (bisa "-" kalau
#                                aplikasi tidak pernah menjawab, atau berisi
#                                beberapa nilai dipisah koma kalau nginx mencoba
#                                lebih dari satu upstream)
#   ust= $upstream_status        status dari aplikasi; beda dengan $status saat
#                                nginx sendiri yang menjawab (504, 499)
#   dev= $http_x_kp_device       label kiosk dari header X-KP-Device
#                                (frontend/js/observability.js), mis. kiosk-01
#
# Awalan barisnya SENGAJA identik dengan "combined", jadi alat yang membaca
# combined (goaccess, skrip lama, collect_incident.sh) tetap jalan; kolom baru
# ditempel di belakang dalam bentuk kunci=nilai. collect_incident.sh otomatis
# mengenali rt= dan menghitung p50/p95 per menit untuk /api/recognize.
# Referensi: https://nginx.org/en/docs/http/ngx_http_log_module.html
#
# ---------------------------------------------------------------------------
# CARA PASANG (manual, di VPS). Baca dulu kenapa manual:
#
# - scripts/remote_update.sh SENGAJA tidak menyentuh nginx.
# - scripts/deploy_vps.sh MENULIS ULANG /etc/nginx/sites-available/faceid
#   dengan versi HTTP polos. Menjalankannya di server yang sudah ber-HTTPS
#   mematikan kamera di semua kiosk (kamera hanya jalan di konteks aman).
#   Jangan pernah pakai skrip itu untuk memasang format log ini.
#
# 1. log_format hanya boleh berada di konteks `http`, bukan di dalam `server`.
#    Ubuntu sudah meng-include /etc/nginx/conf.d/*.conf di dalam blok http,
#    jadi cukup salin berkas ini ke sana:
#
#      sudo cp nginx-logformat.conf /etc/nginx/conf.d/kp-logformat.conf
#
# 2. Buka blok server HTTPS (yang berisi `listen 443 ssl`), biasanya di
#    /etc/nginx/sites-available/faceid, dan tambahkan SATU baris di dalamnya:
#
#      access_log /var/log/nginx/access.log kp_timed;
#
#    Pakai path yang sama dengan log sekarang supaya logrotate dan
#    collect_incident.sh tidak perlu diubah. Salin dulu berkas aslinya:
#
#      sudo cp /etc/nginx/sites-available/faceid /root/faceid.nginx.bak-$(date +%F)
#
# 3. Uji, dan HANYA kalau lolos, muat ulang (reload tidak memutus koneksi):
#
#      sudo nginx -t && sudo systemctl reload nginx
#
#    Kalau `nginx -t` gagal, jangan reload. Kembalikan cadangan dari langkah 2.
#
# 4. Cek satu baris baru berakhiran rt=... urt=... :
#
#      sudo tail -n 3 /var/log/nginx/access.log
#
# Jangan lakukan ini Sabtu 15:00-19:00 WIB.
# ---------------------------------------------------------------------------

log_format kp_timed '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt="$upstream_response_time" '
                    'ust="$upstream_status" dev="$http_x_kp_device"';
