<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen">
    <div class="bg-slate-900 p-8 rounded-2xl shadow-2xl border border-slate-800 w-full max-w-sm">
        <h1 class="text-2xl font-bold text-white mb-6 text-center">🔐 Admin Area</h1>
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <input type="password" id="password" placeholder="Masukkan Password Admin" class="w-full px-4 py-3 rounded-lg bg-slate-950 border border-slate-700 text-white focus:outline-none focus:border-sky-500">
            <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 rounded-lg transition-colors">Masuk</button>
        </form>
        <p id="error" class="text-red-400 text-sm text-center mt-4 hidden"></p>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
