<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foto Tidak Ditemukan — KP Bromo</title>
<style>
:root{--surface:#fff8f1;--ink:#211b0b;--navy:#1d3557;--red:#b7102a;--red-hover:#e63946;--muted:#5a5344}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:24px;
  background:var(--surface);color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;align-items:center;justify-content:center;text-align:center;
}
.card{
  max-width:420px;background:#fff;padding:32px;border-radius:24px;
  border:3px solid var(--navy);box-shadow:4px 4px 0 var(--navy);
}
h1{font-size:20px;font-weight:800;color:var(--red);margin:0 0 8px}
p{font-size:14px;color:var(--muted);margin:0 0 24px;line-height:1.6}
a{
  display:inline-block;padding:10px 24px;background:var(--red);color:#fff;
  border-radius:999px;font-size:12px;font-weight:800;text-decoration:none;
  border:2px solid var(--navy);box-shadow:2px 2px 0 var(--navy);
}
a:hover{background:var(--red-hover)}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
</style>
</head>
<body>
<div class="card">
  <h1>Foto Tidak Ditemukan</h1>
  <p>Tautannya mungkin salah, atau fotonya sudah melewati masa simpan dan dihapus otomatis.</p>
  <a href="/photobooth">Buka Photobooth</a>
</div>
</body>
</html>
