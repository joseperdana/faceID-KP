<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Anggota Baru - GKI Bromo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 lg:p-10">

    <div class="w-full max-w-5xl bg-slate-900 rounded-3xl shadow-2xl border border-slate-800 overflow-hidden flex flex-col lg:flex-row min-h-[500px]">
        
        <div class="relative w-full lg:w-1/2 bg-black flex items-center justify-center group overflow-hidden">
            <video id="video" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
            <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover transform -scale-x-100"></canvas>

            <svg class="absolute inset-0 w-full h-full z-10 pointer-events-none" viewBox="0 0 100 100" preserveAspectRatio="none">
                <defs>
                    <mask id="keyhole-mask" x="0" y="0" width="100%" height="100%">
                        <rect x="0" y="0" width="100%" height="100%" fill="white" />
                        <ellipse cx="50" cy="50" rx="28" ry="42" fill="black" />
                    </mask>
                </defs>
                <rect x="0" y="0" width="100%" height="100%" fill="rgb(2, 6, 23)" fill-opacity="0.9" mask="url(#keyhole-mask)" />
                <ellipse cx="50" cy="50" rx="28" ry="42" fill="none" stroke="#38bdf8" stroke-width="0.3" stroke-dasharray="1" opacity="0.5" />
            </svg>
        </div>

        <div class="w-full lg:w-1/2 bg-slate-800 p-8 flex flex-col justify-center border-l border-slate-700">
            
            <h2 class="text-2xl font-bold text-white mb-6 flex items-center gap-2">
                <span class="bg-sky-600 w-2 h-8 rounded-full"></span>
                Registrasi Anggota
            </h2>

            <form id="reg-form" class="space-y-4">
                <div>
                    <label class="block text-slate-400 text-sm mb-1">Nama Lengkap</label>
                    <input type="text" id="full_name" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition-colors" placeholder="Contoh: Jose Taneo">
                </div>

                <div>
                    <label class="block text-slate-400 text-sm mb-1">Nomor WhatsApp</label>
                    <input type="tel" id="phone_number" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition-colors" placeholder="0812...">
                </div>

                <div id="face-status" class="py-3 px-4 rounded-xl bg-slate-700/50 text-sm text-slate-300 flex items-center justify-between">
                    <span>Status Wajah:</span>
                    <span id="status-text" class="font-bold text-orange-400">Menunggu...</span>
                </div>

                <button type="submit" id="btn-submit" disabled class="w-full bg-sky-600 hover:bg-sky-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg transform active:scale-95 mt-4">
                    📸 Ambil Foto & Simpan
                </button>
            </form>

            <div id="result-message" class="mt-4 hidden p-4 rounded-xl text-center text-sm"></div>
            
            <a href="/" class="mt-6 flex items-center justify-center gap-2 text-slate-500 hover:text-white transition-colors py-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
              </svg>
              Kembali ke Halaman Awal
          </a>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video');
        const btnSubmit = document.getElementById('btn-submit');
        const statusText = document.getElementById('status-text');
        const form = document.getElementById('reg-form');
        const resultMsg = document.getElementById('result-message');

        let isFaceValid = false;

        // 1. Setup Kamera & MediaPipe (Logic Sederhana)
        const faceDetection = new FaceDetection({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`});
        faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.6 });
        
        faceDetection.onResults((results) => {
            // Gambar video ke canvas (biar admin liat)
            const canvas = document.getElementById('output_canvas');
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (results.detections.length > 0) {
                // Cek apakah wajah di tengah (Logic Zona Aman)
                const nose = results.detections[0].landmarks[2];
                const inSafeZone = (nose.x > 0.35 && nose.x < 0.65 && nose.y > 0.25 && nose.y < 0.75);
                
                if (inSafeZone) {
                    isFaceValid = true;
                    statusText.innerText = "✅ Oke (Siap Foto)";
                    statusText.className = "font-bold text-emerald-400";
                    btnSubmit.disabled = false;
                    btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed');
                } else {
                    isFaceValid = false;
                    statusText.innerText = "⚠️ Geser ke Tengah";
                    statusText.className = "font-bold text-orange-400";
                    btnSubmit.disabled = true;
                }
            } else {
                isFaceValid = false;
                statusText.innerText = "❌ Wajah Tidak Terbaca";
                statusText.className = "font-bold text-red-400";
                btnSubmit.disabled = true;
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => { await faceDetection.send({image: videoElement}); }
        });
        camera.start();

       // 2. Handle Submit Form (Burst Mode Capture)
       form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if(!isFaceValid) return;

        const originalText = btnSubmit.innerText;
        btnSubmit.disabled = true;
        resultMsg.classList.add('hidden');

        const formData = new FormData();
        formData.append('full_name', document.getElementById('full_name').value);
        formData.append('phone_number', document.getElementById('phone_number').value);

        // Fungsi pembantu untuk mengambil 1 frame menjadi Blob
        const captureFrame = () => {
            return new Promise((resolve) => {
                const captureCanvas = document.createElement('canvas');
                captureCanvas.width = videoElement.videoWidth;
                captureCanvas.height = videoElement.videoHeight;
                captureCanvas.getContext('2d').drawImage(videoElement, 0, 0);
                captureCanvas.toBlob(resolve, 'image/jpeg', 0.95);
            });
        };

        try {
            // AMBIL 3 FOTO BERTURUT-TURUT DENGAN JEDA 300ms
            btnSubmit.innerText = "📸 Mengambil foto 1/3...";
            const blob1 = await captureFrame();
            formData.append('files', blob1, 'frame1.jpg');
            
            await new Promise(r => setTimeout(r, 300)); // Jeda 300ms
            
            btnSubmit.innerText = "📸 Mengambil foto 2/3...";
            const blob2 = await captureFrame();
            formData.append('files', blob2, 'frame2.jpg');

            await new Promise(r => setTimeout(r, 300)); // Jeda 300ms
            
            btnSubmit.innerText = "📸 Mengambil foto 3/3...";
            const blob3 = await captureFrame();
            formData.append('files', blob3, 'frame3.jpg');

            btnSubmit.innerText = "⏳ Memproses & Menyimpan...";

            // Kirim ke server
            const res = await fetch('/api/register', { method: 'POST', body: formData });
            const data = await res.json();

            resultMsg.classList.remove('hidden');
            if(data.status === 'success') {
                resultMsg.className = "mt-4 p-4 rounded-xl text-center text-sm bg-emerald-900/50 text-emerald-200 border border-emerald-500/50";
                resultMsg.innerHTML = `✅ <b>Berhasil!</b><br>${data.message}`;
                form.reset(); 
                setTimeout(() => resultMsg.classList.add('hidden'), 4000);
            } else {
                throw new Error(data.detail || data.message || "Gagal registrasi");
            }
        } catch (err) {
            resultMsg.classList.remove('hidden');
            resultMsg.className = "mt-4 p-4 rounded-xl text-center text-sm bg-red-900/50 text-red-200 border border-red-500/50";
            resultMsg.innerText = `❌ Error: ${err.message}`;
        } finally {
            btnSubmit.innerText = originalText;
            btnSubmit.disabled = false;
        }
    });
    </script>
</body>
</html>
