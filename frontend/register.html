<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Anggota Baru - GKI Bromo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 lg:p-10">

    <div class="w-full max-w-5xl bg-slate-900 rounded-3xl shadow-2xl border border-slate-800 overflow-hidden flex flex-col lg:flex-row min-h-[500px]">
        
        <div class="relative w-full lg:w-1/2 bg-black flex items-center justify-center group overflow-hidden">
            <video id="video" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
            <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover transform -scale-x-100"></canvas>

            <svg class="absolute inset-0 w-full h-full z-10 pointer-events-none" viewBox="0 0 100 100" preserveAspectRatio="none">
                <defs>
                    <mask id="keyhole-mask" x="0" y="0" width="100%" height="100%">
                        <rect x="0" y="0" width="100%" height="100%" fill="white" />
                        <ellipse cx="50" cy="50" rx="28" ry="42" fill="black" />
                    </mask>
                </defs>
                <rect x="0" y="0" width="100%" height="100%" fill="rgb(2, 6, 23)" fill-opacity="0.9" mask="url(#keyhole-mask)" />
                <ellipse cx="50" cy="50" rx="28" ry="42" fill="none" stroke="#38bdf8" stroke-width="0.3" stroke-dasharray="1" opacity="0.5" />
            </svg>
        </div>

        <div class="w-full lg:w-1/2 bg-slate-800 p-8 flex flex-col justify-center border-l border-slate-700">
            
            <h2 class="text-2xl font-bold text-white mb-6 flex items-center gap-2">
                <span class="bg-sky-600 w-2 h-8 rounded-full"></span>
                Registrasi Anggota
            </h2>

            <form id="reg-form" class="space-y-4">
                <div>
                    <label class="block text-slate-400 text-sm mb-1">Nama Lengkap</label>
                    <input type="text" id="full_name" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition-colors" placeholder="Contoh: Jose Taneo">
                </div>

                <div class="my-4 text-left">
                    <label class="block text-slate-400 text-sm mb-1">Jenis Kelamin:</label>
                    <div class="flex items-center gap-5">
                        <label class="flex items-center gap-2 cursor-pointer text-white font-medium hover:text-sky-400 transition-colors">
                            <input type="radio" name="gender" value="Pria" required class="w-5 h-5 accent-sky-500 cursor-pointer">
                            Pria
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-white font-medium hover:text-sky-400 transition-colors">
                            <input type="radio" name="gender" value="Wanita" required class="w-5 h-5 accent-sky-500 cursor-pointer">
                            Wanita
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-slate-400 text-sm mb-1">Nomor WhatsApp</label>
                    <input type="tel" id="phone_number" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition-colors" placeholder="0812...">
                </div>

                <div id="face-status" class="py-3 px-4 rounded-xl bg-slate-700/50 text-sm text-slate-300 flex items-center justify-between">
                    <span>Status Wajah:</span>
                    <span id="status-text" class="font-bold text-orange-400">Menunggu...</span>
                </div>

                <button type="submit" id="btn-submit" disabled class="w-full bg-sky-600 hover:bg-sky-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg transform active:scale-95 mt-4">
                    📸 Ambil Foto & Simpan
                </button>
            </form>

            <div id="result-message" class="mt-4 hidden p-4 rounded-xl text-center text-sm"></div>
            
            <a href="/" class="mt-6 flex items-center justify-center gap-2 text-slate-500 hover:text-white transition-colors py-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
              </svg>
              Kembali ke Halaman Awal
          </a>
        </div>
    </div>

    <script src="/static/js/register.js"></script>
</body>
</html>
