<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇮🇩 Photobooth KP45 — Komisi Pemuda GKI Bromo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

    <style>
        .flash-animation {
            animation: flash 0.4s ease-out;
        }
        @keyframes flash {
            0% { opacity: 0.9; }
            100% { opacity: 0; }
        }
        .frame-active {
            border-color: #ef4444 !important;
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>

<body class="bg-slate-950 text-white min-h-screen flex flex-col p-3 md:p-6 font-sans selection:bg-red-500 selection:text-white">

    <!-- Top Navigation Bar -->
    <nav class="w-full max-w-5xl mx-auto mb-4 flex justify-between items-center bg-slate-900/90 backdrop-blur-md rounded-2xl p-3 md:p-4 border border-slate-800 shadow-xl z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-600 to-rose-700 flex items-center justify-center text-xl shadow-lg shadow-red-900/40">
                🇮🇩
            </div>
            <div>
                <h1 class="font-black text-sm md:text-base tracking-wide flex items-center gap-2">
                    <span>KP45 PHOTOBOOTH</span>
                    <span class="text-[10px] bg-red-600/30 text-red-300 px-2 py-0.5 rounded-full border border-red-500/40 font-mono">EDISI SPESIAL</span>
                </h1>
                <p class="text-xs text-slate-400">Komisi Pemuda GKI Bromo Malang</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <a href="/" class="flex items-center gap-1.5 px-3.5 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs md:text-sm font-semibold transition-all border border-slate-700 text-slate-200">
                <span>👤</span> <span class="hidden sm:inline">Absen Wajah</span>
            </a>
            <a href="/dashboard" class="flex items-center gap-1.5 px-3.5 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs md:text-sm font-semibold transition-all border border-slate-700 text-slate-200">
                <span>📊</span> <span class="hidden sm:inline">Dashboard</span>
            </a>
        </div>
    </nav>

    <!-- Main Photobooth Layout -->
    <main class="w-full max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 flex-grow items-start">
        
        <!-- Camera Viewport Card -->
        <section class="lg:col-span-8 bg-slate-900/95 rounded-3xl p-4 md:p-6 border border-slate-800 shadow-2xl flex flex-col items-center">
            
            <div class="relative w-full aspect-[4/5] sm:aspect-[3/4] max-h-[580px] bg-black rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center group shadow-inner">
                
                <!-- Video Stream -->
                <video id="video-stream" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
                
                <!-- Live Frame Overlay Preview -->
                <canvas id="frame-overlay-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>

                <!-- Countdown Overlay -->
                <div id="countdown-overlay" class="hidden absolute inset-0 bg-slate-950/70 backdrop-blur-sm z-30 flex flex-col items-center justify-center">
                    <span id="countdown-number" class="text-8xl md:text-9xl font-black text-white animate-bounce drop-shadow-[0_10px_25px_rgba(239,68,68,0.8)]">3</span>
                    <p class="text-red-300 font-semibold text-lg mt-4 tracking-widest uppercase">Bersiap Pose Senyum! ✨</p>
                </div>

                <!-- Camera Flash Effect -->
                <div id="camera-flash" class="hidden absolute inset-0 bg-white z-40 pointer-events-none"></div>

                <!-- Camera Switch & Mirror Controls -->
                <div class="absolute top-4 right-4 z-20 flex gap-2">
                    <button id="btn-toggle-mirror" title="Toggle Mirroring" class="p-2.5 bg-slate-900/80 hover:bg-slate-800 backdrop-blur rounded-xl text-xs font-semibold text-slate-300 border border-slate-700 transition-all active:scale-95 shadow">
                        🪞 Mirror
                    </button>
                    <button id="btn-switch-cam" title="Ganti Kamera" class="p-2.5 bg-slate-900/80 hover:bg-slate-800 backdrop-blur rounded-xl text-xs font-semibold text-slate-300 border border-slate-700 transition-all active:scale-95 shadow">
                        🔄 Kamera
                    </button>
                </div>

            </div>

            <!-- Capture Controls -->
            <div class="w-full mt-5 flex items-center justify-between gap-4">
                <div class="flex items-center gap-2">
                    <span class="text-xs text-slate-400">Timer:</span>
                    <button id="timer-3s" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-red-600 text-white border border-red-500 transition-all">3s</button>
                    <button id="timer-5s" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-slate-400 border border-slate-700 hover:text-white transition-all">5s</button>
                </div>

                <button id="btn-capture" class="flex-grow max-w-sm py-3.5 px-6 bg-gradient-to-r from-red-600 via-rose-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-extrabold rounded-2xl shadow-xl shadow-red-900/50 flex items-center justify-center gap-3 text-base transition-all active:scale-95 border border-red-400/30">
                    <span class="text-xl">📸</span>
                    <span>Ambil Foto KP45</span>
                </button>
            </div>

        </section>

        <!-- Sidebar: Frame Customizer & Props -->
        <aside class="lg:col-span-4 flex flex-col gap-4">
            
            <div class="bg-slate-900/95 rounded-3xl p-5 border border-slate-800 shadow-xl">
                <h2 class="text-base font-bold text-white mb-1 flex items-center gap-2">
                    <span>🎨</span> Pilihan Bingkai (Frames)
                </h2>
                <p class="text-xs text-slate-400 mb-4">Pilih tema bingkai khas Indonesia & KP45</p>

                <!-- Frame Cards List -->
                <div class="grid grid-cols-1 gap-3">
                    
                    <!-- Frame 1: Merah Putih KP45 -->
                    <button class="frame-card frame-active text-left p-3.5 rounded-2xl bg-slate-800/80 hover:bg-slate-800 border-2 border-transparent transition-all flex items-center gap-3.5" data-frame="merah-putih">
                        <div class="w-12 h-14 rounded-xl bg-gradient-to-b from-red-600 via-white to-white flex flex-col items-center justify-between p-1 shadow border border-slate-600 shrink-0">
                            <span class="text-[9px] font-black text-white">KP45</span>
                            <span class="text-[10px]">🇮🇩</span>
                            <span class="text-[7px] font-black text-red-600">GKI</span>
                        </div>
                        <div class="min-w-0 flex-grow">
                            <h3 class="text-sm font-bold text-white">Merah Putih Glory</h3>
                            <p class="text-xs text-slate-400 truncate">Vibrant Merah-Putih & Edisi KP45</p>
                        </div>
                    </button>

                    <!-- Frame 2: Batik Nusantara Gold -->
                    <button class="frame-card text-left p-3.5 rounded-2xl bg-slate-800/80 hover:bg-slate-800 border-2 border-transparent transition-all flex items-center gap-3.5" data-frame="batik-gold">
                        <div class="w-12 h-14 rounded-xl bg-amber-950/80 border border-amber-500/50 flex flex-col items-center justify-between p-1 shadow shrink-0">
                            <span class="text-[8px] text-amber-300 font-serif">⚜️</span>
                            <span class="text-[8px] font-bold text-amber-200">BATIK</span>
                            <span class="text-[8px] text-amber-300 font-serif">⚜️</span>
                        </div>
                        <div class="min-w-0 flex-grow">
                            <h3 class="text-sm font-bold text-amber-200">Batik Heritage Gold</h3>
                            <p class="text-xs text-slate-400 truncate">Ornamen Batik Klasik Elegan</p>
                        </div>
                    </button>

                    <!-- Frame 3: Retro Youth Polaroid -->
                    <button class="frame-card text-left p-3.5 rounded-2xl bg-slate-800/80 hover:bg-slate-800 border-2 border-transparent transition-all flex items-center gap-3.5" data-frame="retro-polaroid">
                        <div class="w-12 h-14 rounded-xl bg-slate-100 flex flex-col items-center justify-between p-1 shadow shrink-0 border-b-4 border-slate-300">
                            <span class="text-[9px]">📷</span>
                            <span class="text-[7px] font-mono text-slate-800 font-bold">1980</span>
                            <span class="text-[7px] font-sans text-slate-600">YOUTH</span>
                        </div>
                        <div class="min-w-0 flex-grow">
                            <h3 class="text-sm font-bold text-white">Youth Retro Polaroid</h3>
                            <p class="text-xs text-slate-400 truncate">Polaroid 90s & Stiker Pemuda</p>
                        </div>
                    </button>

                </div>
            </div>

            <!-- Stickers / Caption Stamp Option -->
            <div class="bg-slate-900/95 rounded-3xl p-5 border border-slate-800 shadow-xl">
                <h2 class="text-sm font-bold text-white mb-2 flex items-center gap-2">
                    <span>✨</span> Custom Pesan / Nama
                </h2>
                <input id="custom-caption-input" type="text" maxlength="30" placeholder="Tulis namamu atau geng kamu..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white placeholder:text-slate-500 focus:outline-none focus:border-red-500 transition-colors">
                <p class="text-[11px] text-slate-500 mt-1.5">Akan tertera rapi di bagian bawah bingkai foto.</p>
            </div>

        </aside>

    </main>

    <!-- Hidden High-Res Snapshot Processing Canvas -->
    <canvas id="snapshot-canvas" class="hidden"></canvas>

    <!-- Result Modal (HD Download & Preview) -->
    <div id="result-modal" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 max-w-lg w-full rounded-3xl p-6 shadow-2xl flex flex-col items-center animate-in fade-in zoom-in duration-300">
            
            <div class="w-full flex justify-between items-center mb-4">
                <h3 class="text-lg font-black text-white flex items-center gap-2">
                    <span>🎉</span> Foto KP45 Siap!
                </h3>
                <button id="btn-close-modal" class="text-slate-400 hover:text-white p-2 text-xl font-bold">✕</button>
            </div>

            <!-- Rendered Composite Image Preview -->
            <div class="relative w-full max-w-[340px] aspect-[4/5] bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-700">
                <img id="result-image-preview" src="" alt="Hasil Foto Photobooth" class="w-full h-full object-contain">
            </div>

            <!-- Modal Action Buttons -->
            <div class="w-full mt-6 grid grid-cols-2 gap-3">
                <button id="btn-retake" class="py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm rounded-xl transition-all border border-slate-700 active:scale-95">
                    🔄 Foto Ulang
                </button>
                <a id="btn-download" href="#" download="KP45-Photobooth.jpg" class="py-3 px-4 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-extrabold text-sm rounded-xl shadow-lg shadow-red-900/40 flex items-center justify-center gap-2 transition-all active:scale-95">
                    <span>📥</span> Unduh HD
                </a>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/photobooth.js"></script>
</body>
</html>
