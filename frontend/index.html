<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absen Komisi Pemuda GKI Bromo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        .progress-bar-transition { transition: width 0.1s linear; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .countdown-bar { animation: countdown 3.5s linear forwards; }
        @keyframes countdown { from { width: 100%; } to { width: 0%; } }
    </style>
</head>

<body class="bg-slate-950 text-white min-h-screen flex flex-col p-4 lg:p-6">

    <nav class="w-full max-w-6xl mx-auto mb-4 flex justify-between items-center bg-slate-900/80 backdrop-blur rounded-2xl p-3 border border-slate-800 shadow-lg z-50">
        <div class="flex items-center gap-2 px-2">
            <span class="text-xl">🏛️</span>
            <span class="font-bold text-sm lg:text-base hidden md:block">Komisi Pemuda GKI Bromo FaceID</span>
        </div>
        
        <div class="flex gap-2">
            <a href="/dashboard" class="flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-sm font-semibold transition-colors border border-slate-700">
                📊 Dashboard
            </a>
            <a href="/register" class="flex items-center gap-2 px-4 py-2 bg-sky-900/50 hover:bg-sky-600 rounded-xl text-sm font-semibold text-sky-200 hover:text-white transition-colors border border-sky-800">
                📝 Daftar Manual
            </a>
             <a href="/logout" class="flex items-center gap-2 px-3 py-2 bg-red-900/30 hover:bg-red-600 rounded-xl text-sm font-semibold text-red-300 hover:text-white transition-colors border border-red-900/50" title="Keluar">
                🚪
            </a>
        </div>
    </nav>


    <div class="w-full max-w-6xl mx-auto bg-slate-900 rounded-3xl shadow-2xl border border-slate-800 overflow-hidden flex flex-col lg:flex-row min-h-[550px] flex-grow">
        
        <div class="relative w-full lg:w-[65%] bg-black flex items-center justify-center group overflow-hidden">
            <video id="video" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
            <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover transform -scale-x-100"></canvas>

            <svg class="absolute inset-0 w-full h-full z-10 pointer-events-none" viewBox="0 0 100 100" preserveAspectRatio="none">
                <defs>
                    <mask id="keyhole-mask" x="0" y="0" width="100%" height="100%">
                        <rect x="0" y="0" width="100%" height="100%" fill="white" />
                        <ellipse cx="50" cy="50" rx="28" ry="42" fill="black" />
                    </mask>
                </defs>
                <rect x="0" y="0" width="100%" height="100%" fill="rgb(2, 6, 23)" fill-opacity="0.95" mask="url(#keyhole-mask)" />
                <ellipse cx="50" cy="50" rx="28" ry="42" fill="none" stroke="#38bdf8" stroke-width="0.3" stroke-dasharray="1" opacity="0.5" />
            </svg>

            <div id="loading" class="hidden absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center z-30">
                <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-sky-500 mb-4"></div>
                <p class="text-sky-400 font-mono animate-pulse">Memproses Wajah...</p>
            </div>
        </div>

        <div class="w-full lg:w-[35%] bg-slate-800/50 p-8 flex flex-col justify-between border-l border-slate-700/50 relative">
            
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Status Scan</h1>
                <div class="h-1 w-20 bg-sky-600 mt-2 rounded-full"></div>
            </div>

            <div id="status-card" class="flex flex-col justify-center py-6 transition-colors duration-300 flex-grow">
                <div id="status-icon" class="text-6xl mb-4 text-slate-500 transition-all duration-300">👤</div>
                <h2 id="status-title" class="text-3xl font-extrabold text-white mb-2 leading-tight">Siap Absen</h2>
                <p id="status-desc" class="text-slate-400 text-lg leading-relaxed">Silakan berdiri tegap di dalam pola oval.</p>

                <div class="mt-6 w-full bg-slate-700 rounded-full h-3 overflow-hidden">
                    <div id="scan-progress" class="bg-gradient-to-r from-sky-400 to-blue-600 h-full w-0 progress-bar-transition"></div>
                </div>
            </div>

            <div id="result-area" class="absolute inset-0 bg-slate-800 p-8 flex flex-col justify-center items-center z-20 hidden fade-in text-center">
                </div>
        </div>
    </div>

    <script>
        // --- Logic AI (Sama) ---
        const REQUIRED_STABLE_FRAMES = 45; 
        const MOVEMENT_THRESHOLD = 0.03; 
        const AUTO_RESET_DELAY = 3500; 
        const SAFE_ZONE_X_MIN = 0.30; const SAFE_ZONE_X_MAX = 0.70;
        const SAFE_ZONE_Y_MIN = 0.20; const SAFE_ZONE_Y_MAX = 0.80;

        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const loadingOverlay = document.getElementById('loading');
        
        const statusIcon = document.getElementById('status-icon');
        const statusTitle = document.getElementById('status-title');
        const statusDesc = document.getElementById('status-desc');
        const progressBar = document.getElementById('scan-progress');
        const resultArea = document.getElementById('result-area');

        let isProcessing = false;
        let stableFramesCount = 0;
        let lastNoseX = null; let lastNoseY = null;

        const faceDetection = new FaceDetection({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`});
        faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.6 });
        faceDetection.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { if (!isProcessing) await faceDetection.send({image: videoElement}); }
        });
        camera.start();

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (results.detections.length > 0) {
                const detection = results.detections[0];
                const noseTip = detection.landmarks[2]; 
                const inSafeZone = (noseTip.x > SAFE_ZONE_X_MIN && noseTip.x < SAFE_ZONE_X_MAX && noseTip.y > SAFE_ZONE_Y_MIN && noseTip.y < SAFE_ZONE_Y_MAX);

                if (inSafeZone) { checkStability(noseTip.x, noseTip.y); } 
                else { 
                    updateStatus('warning', 'Wajah Terlalu Pinggir', 'Geser wajah ke tengah oval.');
                    stableFramesCount = 0; progressBar.style.width = '0%';
                }
            } else {
                updateStatus('idle', 'Mencari Wajah...', 'Pastikan wajah terlihat jelas.');
                stableFramesCount = 0; progressBar.style.width = '0%';
            }
        }

        function checkStability(currentX, currentY) {
            if (isProcessing) return;
            if (lastNoseX !== null && lastNoseY !== null) {
                const movement = Math.sqrt(Math.pow(currentX - lastNoseX, 2) + Math.pow(currentY - lastNoseY, 2));
                if (movement < MOVEMENT_THRESHOLD) {
                    stableFramesCount++;
                    updateStatus('scanning', 'Tahan Posisi...', 'Jangan bergerak...');
                } else {
                    stableFramesCount = 0;
                    updateStatus('warning', 'Terlalu Banyak Gerak', 'Diam sejenak...');
                }
            }
            lastNoseX = currentX; lastNoseY = currentY;
            progressBar.style.width = `${(stableFramesCount / REQUIRED_STABLE_FRAMES) * 100}%`;
            if (stableFramesCount >= REQUIRED_STABLE_FRAMES) { triggerAutoCapture(); }
        }

        function updateStatus(state, title, desc) {
            statusTitle.innerText = title; statusDesc.innerText = desc;
            statusTitle.className = "text-3xl font-extrabold mb-2 leading-tight transition-colors";
            statusIcon.className = "text-6xl mb-4 transition-all duration-300";

            if (state === 'idle') {
                statusTitle.classList.add('text-white');
                statusIcon.innerText = "👤";
                statusIcon.classList.add('text-slate-500');
            } else if (state === 'warning') {
                statusTitle.classList.add('text-orange-400');
                statusIcon.innerText = "⚠️";
                statusIcon.classList.add('text-orange-500', 'animate-bounce');
            } else if (state === 'scanning') {
                statusTitle.classList.add('text-yellow-400');
                statusIcon.innerText = "📸";
                statusIcon.classList.add('text-yellow-400', 'scale-110');
            }
        }

        async function triggerAutoCapture() {
            isProcessing = true;
            loadingOverlay.classList.remove('hidden');
            
            const captureCanvas = document.createElement('canvas');
            captureCanvas.width = videoElement.videoWidth;
            captureCanvas.height = videoElement.videoHeight;
            captureCanvas.getContext('2d').drawImage(videoElement, 0, 0);

            captureCanvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('file', blob, 'capture.jpg');

                try {
                    const response = await fetch('/api/recognize', { method: 'POST', body: formData });
                    const data = await response.json();

                    loadingOverlay.classList.add('hidden');
                    resultArea.classList.remove('hidden');
                    
                    let resultHTML = '';
                    let isError = false;

                    if (data.status === 'success') {
                        // SUKSES
                        resultHTML = `
                            <div class="text-6xl mb-4">🎉</div>
                            <h3 class="text-2xl font-bold text-white mb-2">Halo, ${data.data.name}!</h3>
                            <div class="inline-block bg-emerald-600 text-white text-xs px-3 py-1 rounded-full mb-4">Absensi Berhasil</div>
                            <p class="text-emerald-200 text-sm mb-6">${data.message}</p>
                            <div class="w-full bg-slate-700 h-1 mt-4 rounded-full overflow-hidden"><div class="bg-slate-400 h-full countdown-bar"></div></div>
                            <p class="text-xs text-slate-500 mt-2">Reset otomatis...</p>
                        `;
                    } else {
                        // GAGAL -> TAMPILKAN TOMBOL REGISTER
                        isError = true;
                        resultHTML = `
                            <div class="text-6xl mb-4">🤔</div>
                            <h3 class="text-xl font-bold text-white mb-2">Belum Terdaftar?</h3>
                            <p class="text-red-200 text-sm mb-6">Wajah tidak dikenali di database.</p>
                            
                            <a href="/register" class="inline-flex items-center gap-2 bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 px-6 rounded-xl transition-transform active:scale-95 shadow-lg shadow-sky-900/50 mb-4">
                                📝 Daftar Anggota Baru
                            </a>
                            
                            <button onclick="resetScan()" class="text-slate-400 text-sm hover:text-white underline">Coba Scan Lagi</button>
                        `;
                    }

                    resultArea.innerHTML = resultHTML;

                    // Kalau Sukses, Auto Reset. Kalau Gagal, Tunggu Klik User.
                    if (!isError) {
                        setTimeout(() => { resetScan(); }, AUTO_RESET_DELAY);
                    }

                } catch (err) {
                    loadingOverlay.classList.add('hidden');
                    alert("Koneksi Error");
                    resetScan();
                }
            }, 'image/jpeg', 0.95);
        }

        window.resetScan = function() {
            isProcessing = false;
            resultArea.classList.add('hidden');
            resultArea.innerHTML = '';
            stableFramesCount = 0;
            updateStatus('idle', 'Siap Absen', 'Silakan berdiri tegap...');
            progressBar.style.width = '0%';
        }
    </script>
</body>
</html>
